<!-- main_menu.html -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main Menu — Inner Child</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/main_menu.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="room-wrapper">
    <!-- Viewport ที่ทำหน้าที่ Snap 3 หน้าบน iPad / Mobile -->
    <div class="room-viewport" id="roomViewport">
      <!-- 3 แผ่น Snap สำหรับ iPad/Mobile (ซ่อนบน PC) -->
      <div class="snap-slot" data-page="0"></div>
      <div class="snap-slot" data-page="1"></div>
      <div class="snap-slot" data-page="2"></div>

      <!-- พื้นที่ภาพห้อง + 7 Hotspots วางด้วย % -->
      <div class="room-stage">
        <img src="images/background.jpg" alt="ห้องนิทรรศการ Inner Child" class="room-bg" />

        <!-- Hotspot 1: ตุ๊กตาหมี (น้องเน่า) -->
        <a href="art_show.html?cat=1" class="hotspot hs-1" aria-label="01 Hugs of Memories น้องเน่า">
          <span class="hotspot-badge">01 น้องเน่า</span>
        </a>

        <!-- Hotspot 2: ตุ๊กตาโมเดล -->
        <a href="art_show.html?cat=2" class="hotspot hs-2" aria-label="02 Tiny Treasures ตุ๊กตาโมเดล">
          <span class="hotspot-badge">02 ตุ๊กตาโมเดล</span>
        </a>

        <!-- Hotspot 3: สุนัขและลูกบอล (การละเล่น) -->
        <a href="art_show.html?cat=3" class="hotspot hs-3" aria-label="03 Adventures in Childhood การละเล่น">
          <span class="hotspot-badge">03 การละเล่น</span>
        </a>

        <!-- Hotspot 4: กล่อง Toy (ของเล่น) -->
        <a href="art_show.html?cat=4" class="hotspot hs-4" aria-label="04 Moods with Toys ของเล่น">
          <span class="hotspot-badge">04 ของเล่น</span>
        </a>

        <!-- Hotspot 5: คอมพิวเตอร์ (เกม) -->
        <a href="art_show.html?cat=5" class="hotspot hs-5" aria-label="05 Enjoy the Pixels เกม">
          <span class="hotspot-badge">05 เกม</span>
        </a>

        <!-- Hotspot 6: ทีวีและวิทยุ (หนัง) -->
        <a href="art_show.html?cat=6" class="hotspot hs-6" aria-label="06 Travel Through Tunes หนัง">
          <span class="hotspot-badge">06 หนัง</span>
        </a>

        <!-- Hotspot 7: ตู้เสื้อผ้า/กรอบรูป (ภาพวัยเด็ก/ชุดเด็ก) -->
        <a href="art_show.html?cat=7" class="hotspot hs-7" aria-label="07 Soon to Be Yesterday ภาพวัยเด็ก/ชุดเด็ก">
          <span class="hotspot-badge">07 ภาพวัยเด็ก</span>
        </a>
      </div>
    </div>

    <!-- แถบควบคุมปัด 3 หน้า (แสดงเฉพาะ iPad & Mobile) -->
    <div class="room-pager" id="roomPager">
      <button class="pager-btn" id="roomPrev" aria-label="ส่วนก่อนหน้า">←</button>
      <div class="pager-dots">
        <button class="pager-dot active" data-index="0" aria-label="หน้า 1"></button>
        <button class="pager-dot" data-index="1" aria-label="หน้า 2"></button>
        <button class="pager-dot" data-index="2" aria-label="หน้า 3"></button>
      </div>
      <button class="pager-btn" id="roomNext" aria-label="ส่วนถัดไป">→</button>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/main_menu.js"></script>
</body>
</html>
