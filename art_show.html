<!-- art_show.html -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exhibition Gallery — Inner Child</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/art_show.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="art-show-layout">
    <!-- ฝั่งซ้าย: ข้อมูลหมวดหมู่ -->
    <aside class="category-info-panel">
      <div class="category-header">
        <a href="main_menu.html" class="back-btn" aria-label="กลับหน้าห้อง">&#8592;</a>
        <span class="cat-code" id="catCode">01</span>
      </div>

      <h1 class="en-title" id="enTitle">Hugs of Memories</h1>

      <div class="element-row">
        <div class="element-circle" id="elementCircle">🧸</div>
        <div class="th-title-wrap">
          <span class="th-label">หมวดหมู่</span>
          <h2 class="th-title" id="thTitle">น้องเน่า</h2>
        </div>
      </div>

      <blockquote class="poem-box" id="poemBox"></blockquote>
      <p class="desc-box" id="descBox"></p>
    </aside>

    <!-- ฝั่งขวา: แกลเลอรีผลงาน -->
    <section class="gallery-panel" aria-label="รายการผลงานศิลปะ">
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>
  </main>

  <!-- Popup Modal แสดงผลงานแต่ละคน (เบลอฉากหลัง) -->
  <div class="modal-overlay" id="artModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="ปิดหน้าต่าง">&times;</button>
      <div class="modal-body">
        <div class="modal-image-wrap">
          <img id="modalImg" src="" alt="ผลงานศิลปะ" />
        </div>
        <div class="modal-details">
          <span class="modal-category-pill" id="modalCatTag">01 Hugs of Memories</span>
          <h2 id="modalTitle">ชื่อผลงาน</h2>
          <p class="modal-artist" id="modalArtist">โดย ชื่อคนทำ</p>

          <div class="modal-meta">
            <div class="meta-item">
              <span class="meta-label">เทคนิค</span>
              <span class="meta-value" id="modalTechnique">-</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">ประเภท</span>
              <span class="meta-value" id="modalType">-</span>
            </div>
          </div>

          <div class="modal-concept">
            <h3>แนวคิดผลงาน</h3>
            <p id="modalConcept">-</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/art_show.js"></script>
</body>
</html>
